name = "lunaneleholdings-website"
main = "worker.js"
compatibility_date = "2026-11-11"

# Serves everything in ./public (index.html, logo, sitemap) as the website.
# Requests that don't match a file fall through to worker.js (API routes).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "lunanele-products-db"
database_id = "734b24ca-0af8-4339-b01e-f0baa92e9a83"

# Lets the site email new enquiries to relations@ through the lunanele-email worker.
[[services]]
binding = "EMAILER"
service = "lunanele-email"

[observability]
enabled = true
